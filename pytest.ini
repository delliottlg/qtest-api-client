[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Default: run only unit tests (fast)
# Use -m integration to run live API tests
addopts = -v --tb=short

markers =
    unit: Unit tests with mocked responses (fast, no API calls)
    integration: Integration tests against live sandbox API (slow)
